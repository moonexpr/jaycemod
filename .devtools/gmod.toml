# What this project's dedicated server runs: the gmod plugin's config
# (claude-config2/plugins/gmod/README.md). `dt gmod/srcds start` in this repo
# builds the instance's root from it.

gamemode = "sandcastle"

[addons]  # the repo's addons, linked into the server's addons/
foundation = "addons/foundation"            # the structures and algorithms every other addon stands on
cstrike_weapons = "addons/cstrike_weapons"  # CS:S weapons and grenade effects
nextsoldier = "addons/nextsoldier"          # NextSoldier: the soldier's modules, base entities, response rules
wartactics = "addons/wartactics"            # the tactics engine: squads, scenarios, monitors
model_viewer = "addons/model_viewer"        # a client's window on a model's acts and animations
sandcastle_dev = "addons/sandcastle_dev"    # the dev workbench, run by sandcastle_dev.lua; never released
ulx_luadev = "addons/ulx_luadev"            # ULX's luadev commands (!l, !lm...): its own repo, checked out here

[data]  # data the server writes that the repo keeps
"sandcastle_dev/scenarios" = ".devtools/scenarios"  # the dev workbench's saved scenarios

[server_lua]  # the repo's own server Lua, beside the plugin's
"autorun/server/hotswap.lua" = ".devtools/server_lua/hotswap.lua"                # ws_hotswap_module, ws_hotswap_feature
"autorun/server/sandcastle_dev.lua" = ".devtools/server_lua/sandcastle_dev.lua"  # DEBUG, and the dev workbench

[workshop]  # Workshop addons the server mounts
ulib = "557962238"
ulx = "557962280"
tf2_weapon_pack = "949733637"
bmesa_weapons = "3490724227"
bmesa_npc_weapons = "3497164530"
custom_loadout = "2675972006"
sound_browser = "2718685926"

[downloads]  # needed whether or not the operator subscribes: steamcmd's downloads
hostage_civilian = "3172805326"  # TF2 Classified Civilian/VIP, its npc_civilian models
easy_navmesh_editor = "527885257"
# every item in the Simple Weapons collection; the player classes' loadouts use the base, CS:S and HL2 Extended
simple_weapons = "2821862386"
simple_weapons_css = "2821865508"
simple_weapons_hl2e = "2832566843"
simple_weapons_glowsticks = "2843530927"
simple_weapons_entropy_zero = "2853242748"
simple_weapons_xm25 = "2857030603"
simple_weapons_toybox = "3272572694"
simple_weapons_kill_icons = "3461175264"

[maps]  # the map pool's Workshop maps (sandcastle.txt's "maps")
gm_blackmesa_sigma = "104483047"
gm_excess_construct_13_day = "3544366730"
gm_genesis = "266666023"
gm_shopstruct = "3654206412"
gm_construct_build_conquer13 = "2716888672"
gm_bigmaze = "119710404"  # the path follower's bench (ns_bench_run.py), not in the rotation

[packs]  # the hostages' voice (features/hostage/voice.lua): TF2 Classic's Civilian, by Benjamoose
hostage_civilian_voice = ["1840", "584658549"]

[native.win64]  # cargo xwin build --release --target x86_64-pc-windows-msvc
"gmsv_wsprofile_win64.dll" = "native/ws_profile/target/x86_64-pc-windows-msvc/release/wsprofile.dll"
"gmsv_foundation_win64.dll" = "addons/foundation/native/target/x86_64-pc-windows-msvc/release/foundation.dll"
"gmsv_nextsoldier_win64.dll" = "addons/nextsoldier/native/target/x86_64-pc-windows-msvc/release/nextsoldier.dll"

[native.linux64]  # native_linux.py builds them
"gmsv_wsprofile_linux64.dll" = "native/ws_profile/target/x86_64-unknown-linux-gnu/release/libwsprofile.so"
"gmsv_foundation_linux64.dll" = "addons/foundation/native/target/x86_64-unknown-linux-gnu/release/libfoundation.so"
"gmsv_nextsoldier_linux64.dll" = "addons/nextsoldier/native/target/x86_64-unknown-linux-gnu/release/libnextsoldier.so"

[tf_scripts]  # TF2's sound scripts GMod's own hide on a server; ws/sh_soundscripts.lua reads them
dir = "sandcastle/tf_scripts"
files = [
    "scripts/game_sounds_manifest.txt",
    "scripts/game_sounds.txt",
    "scripts/game_sounds_physics.txt",
    "scripts/game_sounds_weapons.txt",
    "scripts/game_sounds_player.txt",
]
