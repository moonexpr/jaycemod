[package]
name = "nextsoldier"
version = "0.1.0"
edition = "2021"
description = "NextSoldier, native: a soldier's behaviours as the engine's own Action<CLuaNextBot>s, run by its Behavior and IIntention"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foundation = { path = "../../../native/foundation", default-features = false }

[profile.release]
panic = "unwind"
lto = true
